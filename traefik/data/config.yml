http:
 #region routers
  routers:
    proxmox:
      entryPoints:
        - "https"
      rule: "Host(`proxmox.local.animoserver.live`)"
      middlewares:
        - default-headers
        - https-redirectscheme
        - default-whitelist
      tls: {}
      service: proxmox
    pihole:
      entryPoints:
        - "https"
      rule: "Host(`pihole.local.animoserver.live`)"
      middlewares:
        - default-headers
        - https-redirectscheme
        - default-whitelist
      tls: {}
      service: pihole
    amp:
      entryPoints:
        - "https"
      rule: "Host(`amp.animoserver.live`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: amp
    portainer-ms:
      entryPoints:
        - "https"
      rule: "Host(`portainer-ms.animoserver.live`)"
      middlewares:
        - default-headers
      tls: {}
      service: portainer-ms
    minio:
      entryPoints:
        - "https"
      rule: "Host(`minio.local.animoserver.live`)"
      middlewares:
        - secured
      tls: {}
      service: minio
    overseerr:
      entryPoints:
        - "https"
      rule: "Host(`overseerr.animoserver.live`)"
      middlewares:
        - default-headers
      tls: {}
      service: overseerr
    nextcloud:
      rule: "Host(`cloud.animoserver.live`)"
      entrypoints:
        - "https"
      middlewares:
        - nextcloud-chain
      tls: {}
      service: nextcloud
    coder:
      entryPoints:
        - "https"
      rule: "Host(`dev.animoserver.live`) || HostRegexp(`[a-z0-9-].dev.animoserver.live`)"
      middlewares:
        - https-redirectscheme
        - default-headers
        - compress
      tls:
        certResolver: cloudflare
      service: coder
    btwebAPP:
      entryPoints:
        - "https"
      rule: "Host(`btracking.animoserver.live`)"
      middlewares:
        - default-headers
      tls: {}
      service: btwebApp
    # teleport:
    #   entryPoints:
    #     -"https"
    #   rule: "Host(`teleport.animoserver.live`) || HostRegexp(`[a-z0-9-].teleport.animoserver.live`)"
    #   middlewares:
    #     - default-headers
    #   tls: {}
    #   service: teleport
#endregion
#region services
  services:
    proxmox:
      loadBalancer:
        servers:
          - url: "https://192.168.1.200:8006"
        passHostHeader: true
    pihole:
      loadbalancer:
        servers:
          - url: "http://192.168.1.201:81"
        passHostHeader: true
    amp:
      loadBalancer:
        servers:
          - url: "http://192.168.1.131:8080" # Replace with your actual internal IP and port
        passHostHeader: true
    portainer-ms:
      loadBalancer:
        servers:
          - url: "https://192.168.1.168:9443" # Replace with your actual internal IP and port
        passHostHeader: true
    minio:
      loadBalancer:
        servers:
          - url: "http://192.168.1.109:9001" # Replace with your actual internal IP and port
        passHostHeader: true
    overseerr:
      loadBalancer:
        servers:
          - url: "http://192.168.1.168:5055" # Replace with your actual internal IP and port
        passHostHeader: true
    nextcloud:
      loadbalancer:
        servers:
          - url: "http://192.168.1.201:11000"
    btwebApp:
      loadBalancer:
        servers:
          - url: "http://192.168.1.201:5000/"
        passHostHeader: true
    coder:
      loadBalancer:
        servers:
          - url: "http://54.177.207.245:3000"  # Replace with the actual IP of your Coder VM and the port Coder is running on
        passHostHeader: true
    # teleport:
    #   loadBalancer:
    #     servers:
    #       - url: "http://192.168.1.232:3080"
    #     passHostHeader: true

#endregion
  middlewares:
    compress:
      compress: {}

    https-redirectscheme:
      redirectScheme:
        scheme: https
        permanent: true

    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-whitelist:
      ipAllowList:
        sourceRange:
        - "192.168.1.0/24"
        - "172.23.0.0/12"

    secured:
      chain:
        middlewares:
        - default-whitelist
        - default-headers

    nextcloud-secure-headers:
      headers:
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        referrerPolicy: "same-origin"
    nextcloud-chain:
      chain:
        middlewares:
          # - ... (e.g. rate limiting middleware)
          - https-redirectscheme
          - nextcloud-secure-headers
